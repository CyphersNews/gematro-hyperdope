<!DOCTYPE html>
<head>
<title>Reset your password | Cyphers</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="shortcut icon" type="image/x-icon" href="res/favicon.png">

<script src="lib/jquery.min.js"></script>
<script src="lib/supabase.min.js"></script>

<link rel="stylesheet" type="text/css" href="calc/styles.css">
<link rel="stylesheet" type="text/css" href="auth/auth.css">

<script src="auth/supabase-config.js"></script>
<script src="auth/auth.js"></script>
<script src="auth/auth-ui.js"></script>
</head>

<body>
<canvas id="canv"></canvas>

	<a class="authBackBtn" href="index.html" onclick="authBackFlash(this)">&#8592; Back to the calculator</a>

<div class="authPage">
	<div class="authCard">
		<img class="authLogo" src="res/cyphers-logo.png" alt="Cyphers">

		<div class="authTitle">Reset your password</div>
		<div class="authSubtitle">We'll email you a link to set a new one.</div>

		<div id="authMsg" class="authMsg hideValue"></div>

		<form id="forgotForm" novalidate>
			<div class="authField">
				<label class="authLabel" for="email">Email</label>
				<input class="authInput" type="email" id="email" autocomplete="email" spellcheck="false" required>
				<div id="emailErr" class="authFieldErr hideValue"></div>
			</div>

			<button class="authBtn" type="submit" id="forgotBtn">Send reset link</button>
		</form>

		<div class="authFoot">
			Remembered it? <a href="login.html">Sign in</a>
		</div>

	</div>
</div>

<script>
$(document).ready(function () {
	if (!authIsConfigured()) {
		authShowMessage("authMsg", "Authentication is not configured yet. Add your Supabase project URL and anon key in auth/supabase-config.js.", "info");
		document.getElementById("forgotBtn").disabled = true;
	}

	$("#forgotForm").on("submit", function (e) {
		e.preventDefault();
		doForgot();
	});
});

function doForgot() {
	authClearMessage("authMsg");
	authClearFieldErrors(["email"]);

	var email = document.getElementById("email").value;
	if (!authValidEmail(email)) { authFieldError("email", "Enter a valid email address."); return; }

	authSetLoading("forgotBtn", true);
	authRequestPasswordReset(email).then(function () {
		document.getElementById("forgotForm").classList.add("hideValue");
		// deliberately the same response whether or not the address is registered,
		// so this page cannot be used to test which emails have accounts
		authShowMessage("authMsg", "If an account exists for " + email + ", a reset link is on its way. The link expires in one hour.", "success");
	}).catch(function (err) {
		authSetLoading("forgotBtn", false, "Send reset link");
		authShowMessage("authMsg", authFriendlyError(err), "error");
	});
}
</script>
<script src="auth/auth-rain.js"></script>
<script src="calc/coderain.js"></script>
<script>
// honour a saved style/intensity if the visitor has used the calculator
if (window.coderainStyleSaved) { coderainStyle = window.coderainStyleSaved }
if (window.coderainDensitySaved) { coderainDensity = window.coderainDensitySaved }
if (window.coderainSpeedSaved) { coderainSpeedMul = window.coderainSpeedSaved }
toggleCodeRain();
$(window).on("resize", function () { if (optMatrixCodeRain) toggleCodeRain(); });
</script>
</body>
