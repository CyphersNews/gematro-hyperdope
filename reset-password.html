<!DOCTYPE html>
<head>
<title>Set a new password | Cyphers</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="shortcut icon" type="image/x-icon" href="res/favicon.png">

<script src="lib/jquery.min.js"></script>
<script src="lib/supabase.min.js"></script>

<link rel="stylesheet" type="text/css" href="calc/styles.css">
<link rel="stylesheet" type="text/css" href="auth/auth.css">

<script src="auth/supabase-config.js"></script>
<script src="auth/auth.js"></script>
<script src="auth/auth-ui.js"></script>
</head>

<body>
<div class="authPage">
	<div class="authCard">

		<div class="authTitle">Set a new password</div>
		<div class="authSubtitle" id="authSub">Checking your reset link…</div>

		<div id="authMsg" class="authMsg hideValue"></div>

		<form id="resetForm" class="hideValue" novalidate>
			<div class="authField">
				<label class="authLabel" for="password">New password</label>
				<input class="authInput" type="password" id="password" autocomplete="new-password" required>
				<div class="authMeter" id="pwMeter">
					<div class="authMeterSeg"></div><div class="authMeterSeg"></div><div class="authMeterSeg"></div>
					<div class="authMeterSeg"></div><div class="authMeterSeg"></div>
				</div>
				<div class="authHint">At least 10 characters, with an uppercase letter, a lowercase letter and a number.</div>
				<div id="passwordErr" class="authFieldErr hideValue"></div>
			</div>

			<div class="authField">
				<label class="authLabel" for="confirm">Confirm new password</label>
				<input class="authInput" type="password" id="confirm" autocomplete="new-password" required>
				<div id="confirmErr" class="authFieldErr hideValue"></div>
			</div>

			<button class="authBtn" type="submit" id="resetBtn">Save new password</button>
		</form>

		<div class="authFoot" style="margin-top: 1.4em;">
			<a href="login.html">Back to sign in</a>
		</div>

	</div>
</div>

<script>
// Following the emailed link puts a short-lived recovery session in the URL,
// which supabase-js exchanges automatically (detectSessionInUrl). Without a
// valid session there is nothing to update, so the form stays hidden.
$(document).ready(function () {
	if (!authIsConfigured()) {
		document.getElementById("authSub").textContent = "";
		authShowMessage("authMsg", "Authentication is not configured yet. Add your Supabase project URL and anon key in auth/supabase-config.js.", "info");
		return;
	}

	$("#password").on("input", function () {
		var score = authPasswordStrength(this.value);
		$("#pwMeter .authMeterSeg").each(function (i) {
			this.className = "authMeterSeg" + (i < score ? " on" + score : "");
		});
	});

	$("#resetForm").on("submit", function (e) {
		e.preventDefault();
		doReset();
	});

	onAuthReady(function (user) {
		if (user === null) {
			document.getElementById("authSub").textContent = "";
			authShowMessage("authMsg", "This reset link is invalid or has expired. Request a new one from the forgot password page.", "error");
			return;
		}
		document.getElementById("authSub").textContent = "Choose a new password for " + (user.email || "your account") + ".";
		document.getElementById("resetForm").classList.remove("hideValue");
	});
});

function doReset() {
	authClearMessage("authMsg");
	authClearFieldErrors(["password", "confirm"]);

	var password = document.getElementById("password").value;
	var confirm = document.getElementById("confirm").value;

	var bad = false;
	var problems = authPasswordProblems(password);
	if (problems.length) { authFieldError("password", "Password needs " + problems.join(", ") + "."); bad = true; }
	if (confirm !== password) { authFieldError("confirm", "Passwords do not match."); bad = true; }
	if (bad) return;

	authSetLoading("resetBtn", true);
	authUpdatePassword(password).then(function () {
		document.getElementById("resetForm").classList.add("hideValue");
		document.getElementById("authSub").textContent = "";
		authShowMessage("authMsg", "Password updated. You can sign in with it now.", "success");
		setTimeout(function () { window.location.href = "login.html"; }, 2200);
	}).catch(function (err) {
		authSetLoading("resetBtn", false, "Save new password");
		authShowMessage("authMsg", authFriendlyError(err), "error");
	});
}
</script>
</body>
