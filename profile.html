<!DOCTYPE html>
<head>
<title>Your profile | Cyphers</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="shortcut icon" type="image/x-icon" href="res/favicon.png">

<script src="lib/jquery.min.js"></script>
<script src="lib/supabase.min.js"></script>

<link rel="stylesheet" type="text/css" href="calc/styles.css">
<link rel="stylesheet" type="text/css" href="auth/auth.css">

<script src="auth/supabase-config.js"></script>
<script src="auth/auth.js"></script>
<script src="auth/auth-ui.js"></script>
</head>

<body>
<div class="authPage">
	<div class="authCard">

		<div id="profileHead" class="authProfileHead"></div>

		<div id="authMsg" class="authMsg hideValue"></div>

		<div class="authField">
			<label class="authLabel" for="username">Display name</label>
			<input class="authInput" type="text" id="username" maxlength="32" autocomplete="nickname">
			<div id="usernameErr" class="authFieldErr hideValue"></div>
			<div class="authHint">Shown instead of your email. 2&ndash;32 characters.</div>
		</div>
		<button class="authBtn" type="button" id="saveBtn" onclick="doSave()">Save</button>

		<div class="authDivider">account</div>

		<div id="profileRows"></div>

		<div id="linkArea" class="hideValue" style="margin-top: 1.2em;">
			<button class="authBtn authBtnDiscord" type="button" id="linkBtn" onclick="doLink()">
				<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.317 4.369a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.211.375-.445.865-.608 1.249a18.27 18.27 0 0 0-5.487 0 12.65 12.65 0 0 0-.617-1.25.077.077 0 0 0-.079-.036A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.009c.12.099.246.198.373.292a.077.077 0 0 1-.006.127c-.598.35-1.22.645-1.873.891a.077.077 0 0 0-.041.107c.36.699.772 1.364 1.225 1.993a.076.076 0 0 0 .084.029 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.056c.5-5.177-.838-9.674-3.548-13.66a.061.061 0 0 0-.031-.028ZM8.02 15.331c-1.182 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418Zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418Z"/></svg>
				Link your Discord account
			</button>
			<div class="authHint" style="text-align: center; padding-top: 0.5em;">Sign in with Discord next time, using this same account.</div>
		</div>

		<button class="authBtn" type="button" style="margin-top: 1.4em;" onclick="authNavSignOut(event)">Sign out</button>

		<div class="authFoot" style="margin-top: 1.4em;">
			<a href="index.html">&#8592; Back to the calculator</a>
		</div>

	</div>
</div>

<script>
requireAuth("login.html");

$(document).ready(function () {
	onAuthReady(function (user) {
		if (user === null) return; // requireAuth is redirecting
		syncProfile().then(renderProfile).catch(function (err) {
			authShowMessage("authMsg", authFriendlyError(err), "error");
			renderProfile();
		});
	});
});

function renderProfile() {
	var u = authUser;
	if (u === null) return;

	var avatar = authAvatarUrl();
	var head = avatar
		? '<img class="authProfileAvatar" src="' + authEsc(avatar) + '" alt="">'
		: '<div class="authProfileAvatar">' + authEsc(authDisplayName().charAt(0).toUpperCase()) + '</div>';
	head += '<div><div style="font-size:125%;font-weight:600;color:var(--font-white-1)">' + authEsc(authDisplayName()) + '</div>' +
	        '<div style="font-size:85%;color:var(--font-white-3)">' + authEsc(u.email || "Discord account") + '</div></div>';
	document.getElementById("profileHead").innerHTML = head;

	document.getElementById("username").value = (authProfile && authProfile.username) ? authProfile.username : "";

	var verified = !!u.email_confirmed_at;
	var hasDiscord = !!(authProfile && authProfile.discord_id);

	var rows = "";
	rows += row("Email", authEsc(u.email || "&mdash;") +
		(u.email ? '<span class="authBadge ' + (verified ? "authBadgeOk" : "") + '">' + (verified ? "verified" : "unverified") + "</span>" : ""));
	rows += row("Discord", hasDiscord
		? authEsc(authProfile.discord_username || "linked") + '<span class="authBadge authBadgeOk">linked</span>'
		: "not linked");
	if (hasDiscord && authProfile.discord_id) rows += row("Discord ID", authEsc(authProfile.discord_id));
	rows += row("Member since", authProfile && authProfile.created_at
		? new Date(authProfile.created_at).toLocaleDateString()
		: new Date(u.created_at).toLocaleDateString());
	document.getElementById("profileRows").innerHTML = rows;

	document.getElementById("linkArea").classList.toggle("hideValue", hasDiscord);
}

function row(k, v) {
	return '<div class="authProfileRow"><span class="authProfileKey">' + k + '</span><span class="authProfileVal">' + v + "</span></div>";
}

function doSave() {
	authClearMessage("authMsg");
	authClearFieldErrors(["username"]);

	var name = document.getElementById("username").value.trim();
	if (name.length > 0 && (name.length < 2 || name.length > 32)) {
		authFieldError("username", "Use between 2 and 32 characters."); return;
	}
	if (name.length > 0 && !/^[\w .\-]+$/.test(name)) {
		authFieldError("username", "Letters, numbers, spaces, dots and dashes only."); return;
	}

	authSetLoading("saveBtn", true);
	updateProfile({ username: name === "" ? null : name }).then(function () {
		authSetLoading("saveBtn", false, "Save");
		authShowMessage("authMsg", "Profile saved.", "success");
		renderProfile();
	}).catch(function (err) {
		authSetLoading("saveBtn", false, "Save");
		var m = (err.message || "").toLowerCase();
		if (m.indexOf("duplicate") > -1 || m.indexOf("unique") > -1) {
			authFieldError("username", "That display name is already taken.");
		} else {
			authShowMessage("authMsg", authFriendlyError(err), "error");
		}
	});
}

function doLink() {
	authClearMessage("authMsg");
	authSetLoading("linkBtn", true);
	authLinkDiscord().catch(function (err) {
		authSetLoading("linkBtn", false, "Link your Discord account");
		var m = (err.message || "").toLowerCase();
		if (m.indexOf("already") > -1) {
			authShowMessage("authMsg", "That Discord account is already linked to a different Cyphers account.", "error");
		} else {
			authShowMessage("authMsg", authFriendlyError(err), "error");
		}
	});
}
</script>
</body>
