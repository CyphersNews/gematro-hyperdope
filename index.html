		<div id="dateCalcMenuArea"></div>
		<div id="astroMenuArea"></div>
		<div id="profileMenuArea"></div>

		<div id="inputArea">
		  <input id="queryDBbtn" class="hideValue" type="button" onclick="queryDatabase()" value="Query">
		  <input id="phraseBox" autofocus type="text" spellcheck="false" autocomplete="off" oninput="updateEnabledCipherTable(); updateWordBreakdown(breakCipher,false,false);" onkeydown="phraseBoxKeypress(event.keyCode)" ondrop="dropHandler(event)" ondragover="dragOverHandler(event)">
		  <!-- a <button> rather than an <input>, so the return arrow can be drawn:
		       Montserrat has no glyph for U+23CE or U+21B5, so a text one fell back
		       to whatever the system had and came out thin and undersized -->
		  <button id="enterPhraseBtn" type="button" title="Add this phrase to the table (Enter)" aria-label="Add phrase" onclick="phraseBoxKeypress(13);document.getElementById('phraseBox').focus()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 10 5 14 9 18"></polyline><path d="M20 6v4a4 4 0 0 1-4 4H5"></path></svg></button>
		  <input id="highlightBox" type="text" spellcheck="false" autocomplete="off"><span id="clearFilterButton"></span>
		</div>

		<div id="enabledCiphTable"></div>

		<div id="BreakdownDetails">
			<div id="BreakdownSpot"></div>
			<div id="ChartSpotScroll"><div id="ChartSpot"></div></div>
		</div>
	</center>


	<center>	
		<div id="HistoryTableArea"></div>

<!-- Initialzie the calculator.  This needs to run before loading a database or theme. -->
<script>
	initCalc(true);

	// Signing in lands here, on the calculator. The welcome page is reached
	// from exactly one place - a member who has not been through it yet - so
	// there is no path that can send a returning member back to it.
	//
	// It used to be the other way round: every sign-in went to the welcome and
	// that page decided whether to bounce back, which meant any failure to
	// record "already seen" left a member stuck behind it on every visit.
	if (typeof onAuthReady === "function") {
		onAuthReady(function (user) {
			if (user === null || !authProfile) return;
			if (authProfile.setup_done !== false) return; // seen it, or column absent
			window.location.replace("profile.html");
		});
	}
</script>

<!-- AUTO LOAD DATABASE (DB) -->
<!-- To change the word matching database reference a different file in the script below or append lines to db.txt -->

<script>
	var database = loadFile('db.txt');
	importFileAction(database, true);
</script>
